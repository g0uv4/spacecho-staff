<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Spacecho 組織圖</title>
<style>
  :root {
    --bg: #F6F0E6;
    --ink: #3A3228;
    --dim: #7A6A58;
    --paper: #F6F0E6;
    --card: #FBF6EC;
    --edge: #8B6F55;
    --terra: #C46A4A;
    --ochre: #C48A3A;
    --gold: #C48A3A;
    --cyan: #5A7A72;
    --violet: #7A5E78;
    --rose: #A85A62;
    --blue: #5A6E88;
    --amber: #C48A3A;
    --mint: #5E7A62;
    --slate: #6E6458;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Noto Serif CJK TC", "Noto Sans CJK TC", "Noto Sans CJK SC", serif;
    overflow: hidden; }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  /* faint washi fiber overlay — not scanlines */
  .washi-fiber {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background:
      repeating-linear-gradient(92deg, rgba(90,70,50,0.018) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(8deg, rgba(70,55,40,0.012) 0 1px, transparent 1px 11px);
  }
  #title {
    position: fixed; top: 18px; left: 22px; z-index: 4;
    font-family: "Noto Serif CJK TC", "Noto Serif CJK SC", "Songti TC", serif;
    font-size: 15px; font-weight: 600; letter-spacing: 0.06em;
    color: #3A3228; pointer-events: none;
  }
  #title span { color: #8A6A3A; font-weight: 500; }
  #hud {
    position: fixed; right: 24px; bottom: 24px; z-index: 3;
    min-width: 220px; max-width: 320px;
    padding: 10px 13px 12px;
    background: var(--card);
    border: 1px solid rgba(90,70,48,0.18);
    border-radius: 3px;
    box-shadow: 1px 2px 0 rgba(90,70,48,0.06), 0 8px 18px rgba(80,60,40,0.06);
    font-family: "Noto Serif CJK TC", "Noto Sans CJK TC", serif;
    font-size: 12px; line-height: 1.55; color: #3A3228;
    pointer-events: none;
  }
  #hud .k { color: #8A6A3A; letter-spacing: 0.14em; font-size: 10px; margin-bottom: 2px; }
  #hud .v { color: #5A3E28; font-weight: 600; }
  #toolbar {
    position: fixed; top: 16px; right: 18px; z-index: 5;
    display: flex; gap: 8px; align-items: center;
  }
  #toolbar button, .paper-btn {
    font-family: "Noto Serif CJK TC", "Noto Sans CJK TC", serif;
    font-size: 12px; letter-spacing: 0.08em;
    color: #3A3228; background: var(--card);
    border: 1px solid rgba(90,70,48,0.22);
    border-radius: 3px;
    padding: 6px 11px;
    box-shadow: 1px 2px 0 rgba(90,70,48,0.06);
    cursor: pointer;
  }
  #toolbar button:hover, .paper-btn:hover { background: #F3E8D4; }
  a.paper-btn { text-decoration: none; }
  #label-prompt, #prompt-pack {
    position: fixed; z-index: 8;
    background: var(--card);
    border: 1px solid rgba(90,70,48,0.22);
    border-radius: 3px;
    box-shadow: 1px 2px 0 rgba(90,70,48,0.06), 0 10px 22px rgba(80,60,40,0.10);
    font-family: "Noto Serif CJK TC", "Noto Sans CJK TC", serif;
    color: #3A3228;
  }
  #label-prompt {
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: min(360px, 90vw); padding: 14px 16px 13px;
  }
  #label-prompt .k, #prompt-pack .k {
    color: #8A6A3A; letter-spacing: 0.14em; font-size: 10px; margin-bottom: 6px;
  }
  #label-prompt p { font-size: 13px; line-height: 1.55; margin-bottom: 8px; }
  #label-prompt input {
    width: 100%; padding: 6px 8px; margin-bottom: 10px;
    border: 1px solid rgba(90,70,48,0.22); background: #FBF6EC;
    font-family: inherit; font-size: 13px; color: #3A3228;
  }
  #label-prompt .row, #prompt-pack .row { display: flex; gap: 8px; justify-content: flex-end; }
  #prompt-pack {
    top: 52px; right: 18px; width: min(440px, 92vw); max-height: calc(100vh - 80px);
    overflow: auto; padding: 12px 14px 14px; display: none;
  }
  #prompt-pack.open { display: block; }
  #prompt-pack .block {
    background: #F6F0E6; border: 1px solid rgba(90,70,48,0.14);
    padding: 8px 10px; margin: 8px 0; font-size: 12px; line-height: 1.65;
    white-space: pre-wrap;
  }
  #prompt-pack .who { color: #8A6A3A; font-size: 11px; letter-spacing: 0.08em; margin-bottom: 4px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="washi-fiber" aria-hidden="true"></div>
<div id="title">Spacecho · <span>組織圖</span></div>
<div id="hud">
  <div class="k">紙箋</div>
  <div id="tip">節點或邊 — 只顯示語意標籤</div>
</div>
<div id="toolbar">
  <a class="paper-btn" href="/punch.html">打卡</a>
  <button type="button" id="btn-save">儲存關係</button>
  <button type="button" id="btn-clear">清除自訂線</button>
</div>
<div id="label-prompt" class="hidden">
  <div class="k">紙箋 · 新線</div>
  <p id="label-desc"></p>
  <input id="label-input" maxlength="40" />
  <div class="row">
    <button type="button" class="paper-btn" id="label-cancel">取消</button>
    <button type="button" class="paper-btn" id="label-ok">確認</button>
  </div>
</div>
<div id="prompt-pack">
  <div class="k">紙箋 · 僅給老闆的提示稿</div>
  <div id="prompt-list"></div>
  <div id="pack-note" class="block" style="margin-top:8px">已交給 Ranette，等她轉達。</div>
  <div class="row" style="margin-top:10px">
    <button type="button" class="paper-btn" id="pack-close">關閉</button>
  </div>
</div>
<script src="/org-data.js"></script>
<script src="/org.js"></script>
</body>
</html>
