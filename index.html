<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Spacecho 組織圖</title>
<style>
  :root {
    --bg: #F6F0E6;
    --ink: #3A3228;
    --dim: #7A6A58;
    --paper: #F6F0E6;
    --card: #FBF6EC;
    --edge: #8B6F55;
    --terra: #C46A4A;
    --ochre: #C48A3A;
    --gold: #C48A3A;
    --cyan: #5A7A72;
    --violet: #7A5E78;
    --rose: #A85A62;
    --blue: #5A6E88;
    --amber: #C48A3A;
    --mint: #5E7A62;
    --slate: #6E6458;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Noto Serif CJK TC", "Noto Sans CJK TC", "Noto Sans CJK SC", serif;
    overflow: hidden; }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  /* faint washi fiber overlay — not scanlines */
  .washi-fiber {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background:
      repeating-linear-gradient(92deg, rgba(90,70,50,0.018) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(8deg, rgba(70,55,40,0.012) 0 1px, transparent 1px 11px);
  }
  #title {
    position: fixed; top: 18px; left: 22px; z-index: 4;
    font-family: "Noto Serif CJK TC", "Noto Serif CJK SC", "Songti TC", serif;
    font-size: 15px; font-weight: 600; letter-spacing: 0.06em;
    color: #3A3228; pointer-events: none;
  }
  #title span { color: #8A6A3A; font-weight: 500; }
  #hud {
    position: fixed; right: 24px; bottom: 24px; z-index: 3;
    min-width: 220px; max-width: 320px;
    padding: 10px 13px 12px;
    background: var(--card);
    border: 1px solid rgba(90,70,48,0.18);
    border-radius: 3px;
    box-shadow: 1px 2px 0 rgba(90,70,48,0.06), 0 8px 18px rgba(80,60,40,0.06);
    font-family: "Noto Serif CJK TC", "Noto Sans CJK TC", serif;
    font-size: 12px; line-height: 1.55; color: #3A3228;
    pointer-events: none;
  }
  #hud .k { color: #8A6A3A; letter-spacing: 0.14em; font-size: 10px; margin-bottom: 2px; }
  #hud .v { color: #5A3E28; font-weight: 600; }
  #legend {
    position: fixed; left: 22px; bottom: 22px; z-index: 3;
    max-width: 400px;
    padding: 8px 10px 10px;
    background: transparent;
    border: none;
    box-shadow: none;
    font-family: "Noto Serif CJK TC", "Noto Sans CJK TC", serif;
    font-size: 11px; color: #7A6A58; letter-spacing: 0.04em;
    line-height: 1.6;
    pointer-events: none;
  }
  #legend .title {
    color: #6A5848; letter-spacing: 0.12em; font-size: 10px; margin-bottom: 3px;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="washi-fiber" aria-hidden="true"></div>
<div id="title">Spacecho · <span>組織圖</span></div>
<div id="hud">
  <div class="k">紙箋</div>
  <div id="tip">節點或邊 — 只顯示語意標籤</div>
</div>
<div id="legend">
  <div class="title">圖例</div>
  粒子 = 路上的任務 · 虛線 = 抄送／查核中轉<br>
  圓形頭像 = 來源港口與隊員 · 幾何形只在無圖時使用
</div>

      n.y = uy * H;
    });

  }

  function pairKey(a, b) {
    return a < b ? a + "|" + b : b + "|" + a;
  }

  const pairCount = {};
  EDGES.forEach(e => {
    const k = pairKey(e.from, e.to);
    pairCount[k] = (pairCount[k] || 0) + 1;
    e._pairIndex = pairCount[k] - 1;
  });
  const pairTotal = {};
  EDGES.forEach(e => {
    const k = pairKey(e.from, e.to);
    pairTotal[k] = (pairTotal[k] || 0) + 1;
  });

  function hubBoost(e) {
    return HUBS.has(e.from) || HUBS.has(e.to);
  }

  function prepEdge(e) {
    const a = byId[e.from], b = byId[e.to];
    const k = pairKey(e.from, e.to);
    const n = pairTotal[k];
    const i = e._pairIndex;
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const spread = n === 1 ? 0 : (i - (n - 1) / 2) * 28;
    const bow = (e.from < e.to ? 1 : -1) * (36 + Math.abs(spread));
    e.x1 = a.x; e.y1 = a.y; e.x2 = b.x; e.y2 = b.y;
    e.cx = (a.x + b.x) / 2 + nx * (bow + spread);
    e.cy = (a.y + b.y) / 2 + ny * (bow + spread);
    e.color = a.color;
    e.particles = [];
  }

  const _qp = { x: 0, y: 0 };
  const _qt = { x: 0, y: 0 };

  const LIVE_SLOTS = 6;
  const SLOT_HOLD_MS = 4200;
  const LIVE = Array.from({ length: LIVE_SLOTS }, (_, i) => ({
    edge: EDGES[i % EDGES.length],
    t: (i / LIVE_SLOTS + 0.13) % 1,
    speed: 0.00011 + (i % 3) * 0.000018,
    until: 0,
  }));
  function pickLiveEdge(slot, now, avoid) {
    const n = EDGES.length;
    let idx = (Math.floor(now / 97) + slot * 11) % n;
    for (let k = 0; k < n; k++) {
      const e = EDGES[(idx + k) % n];
      if (e !== avoid && !LIVE.some(s => s !== LIVE[slot] && s.edge === e)) {
        return e;
      }
    }
    return EDGES[idx];
  }
  function tickLive(now) {
    for (let i = 0; i < LIVE.length; i++) {
      const s = LIVE[i];
      if (now >= s.until) {
        const prev = s.edge;
        s.edge = pickLiveEdge(i, now, prev);
        s.t = Math.random() * 0.15;
        s.speed = 0.00010 + Math.random() * 0.00004;
        s.until = now + SLOT_HOLD_MS + (i * 180);
      }
    }
  }

  function qpoint(e, t, out) {
    const u = 1 - t;
    const o = out || _qp;
    o.x = u * u * e.x1 + 2 * u * t * e.cx + t * t * e.x2;
    o.y = u * u * e.y1 + 2 * u * t * e.cy + t * t * e.y2;
    return o;
  }

  function qtangent(e, t, out) {
    const o = out || _qt;
    const dx = 2 * (1 - t) * (e.cx - e.x1) + 2 * t * (e.x2 - e.cx);
    const dy = 2 * (1 - t) * (e.cy - e.y1) + 2 * t * (e.y2 - e.cy);
    const len = Math.hypot(dx, dy) || 1;
    o.x = dx / len;
    o.y = dy / len;
    return o;
  }

  function distToQuad(e, px, py) {
    let best = 1e9;
    for (let i = 0; i <= 24; i++) {
      const p = qpoint(e, i / 24);
      const d = Math.hypot(p.x - px, p.y - py);
      if (d < best) best = d;
    }
    return best;
  }

  function drawSpace() {
    ctx.fillStyle = "#F6F0E6";
    ctx.fillRect(0, 0, W, H);
    const wash = ctx.createRadialGradient(W * 0.48, H * 0.38, 40, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
    wash.addColorStop(0, "rgba(255, 248, 236, 0.55)");
    wash.addColorStop(0.55, "rgba(246, 240, 230, 0.15)");
    wash.addColorStop(1, "rgba(232, 220, 200, 0.45)");
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, W, H);
    for (const s of STARS) {
      ctx.fillStyle = `rgba(120,95,70,${s.a})`;
      ctx.fillRect(s.x * W, s.y * H, s.r < 0.35 ? 4 : 1, s.r < 0.35 ? 1 : 3);
    }
  }

  function drawClusters() {
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = '12px "Noto Serif CJK TC","Noto Sans CJK TC","Noto Sans CJK SC",serif';
    ctx.letterSpacing = "0.18em";
    for (const c of CLUSTERS) {
      ctx.fillStyle = "rgba(90, 74, 58, 0.38)";
      ctx.fillText(c.label, c.x * W, c.y * H);
    }
    ctx.restore();
  }

  function edgeFocus(e) {
    if (!hover) return "normal";
    if (hover.type === "edge") return hover.e === e ? "hot" : "dim";
    if (hover.type === "node") {
      return (e.from === hover.n.id || e.to === hover.n.id) ? "hot" : "dim";
    }
    return "normal";
  }

  function drawArrow(e, alpha) {
    const dest = byId[e.to];
    const t = Math.max(0.82, 1 - (dest.r + 10) / 220);
    const p = qpoint(e, t);
    const tan = qtangent(e, t);
    const size = 8.5;
    const backx = p.x - tan.x * size;
    const backy = p.y - tan.y * size;
    const lx = -tan.y, ly = tan.x;
    ctx.beginPath();
    ctx.moveTo(p.x + tan.x * 2, p.y + tan.y * 2);
    ctx.lineTo(backx + lx * size * 0.55, backy + ly * size * 0.55);
    ctx.lineTo(backx - lx * size * 0.55, backy - ly * size * 0.55);
    ctx.closePath();
    ctx.fillStyle = hexA(e.color, alpha);
    ctx.fill();
  }

  function drawEdge(e, mode) {
    const hot = mode === "hot";
    const dim = mode === "dim";
    const gray = hot ? "rgba(92,68,48,0.88)" : dim ? "rgba(120,96,72,0.10)" : (e.dashed ? "rgba(120,88,62,0.42)" : "rgba(110,82,58,0.36)");
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(e.x1, e.y1);
    ctx.quadraticCurveTo(e.cx, e.cy, e.x2, e.y2);
    ctx.strokeStyle = gray;
    ctx.lineWidth = hot ? 1.35 : 0.9;
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.setLineDash(e.dashed ? [3.5, 5.5] : [2.5, 4.5]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function drawLiveParticles(dt, now) {
    tickLive(now);
    for (const s of LIVE) {
      const e = s.edge;
      const mode = edgeFocus(e);
      const dim = mode === "dim";
      const hot = mode === "hot";
      const gain = dim ? 0.35 : hot ? 1 : 0.92;
      s.t += s.speed * dt;
      if (s.t >= 1) {
        s.t -= Math.floor(s.t);
        s.edge = pickLiveEdge(LIVE.indexOf(s), now, e);
        s.until = now + SLOT_HOLD_MS;
      }
      const pt = qpoint(s.edge, s.t, _qp);
      const terra = "#C46A4A";
      ctx.fillStyle = hexA(terra, 0.12 * gain);
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 3.2, 0, Math.PI * 2);
      ctx.fill();
      const half = 2.4;
      ctx.fillStyle = hexA(terra, 0.86 * gain);
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, half, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function nodeFocus(n) {
    if (!hover) return "normal";
    if (hover.type === "node") return hover.n === n ? "hot" : "soft";
    if (hover.type === "edge") {
      return (hover.e.from === n.id || hover.e.to === n.id) ? "hot" : "soft";
    }
    return "normal";
  }

  function drawSourceShape(n, r) {
    const s = n.shape || "diamond";
    ctx.beginPath();
    if (s === "square") {
      const h = r * 0.86;
      ctx.rect(n.x - h, n.y - h, h * 2, h * 2);
    } else if (s === "ring") {
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    } else {
      ctx.moveTo(n.x, n.y - r);
      ctx.lineTo(n.x + r, n.y);
      ctx.lineTo(n.x, n.y + r);
      ctx.lineTo(n.x - r, n.y);
      ctx.closePath();
    }
  }

  function drawNode(n, mode) {
    const hot = mode === "hot";
    const src = n.kind === "source";
    ctx.save();
    if (mode === "soft") ctx.globalAlpha = 0.48;
    ctx.shadowColor = "rgba(90,70,48,0.12)";
    ctx.shadowBlur = hot ? 4 : 0;
    ctx.fillStyle = hexA(n.color, src ? 0.08 : 0.12);
    if (src && n._img) {
      const s = n.r * 2.15;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 3, 0, Math.PI * 2);
      ctx.fillStyle = hexA(n.color, 0.14);
      ctx.fill();
      ctx.save();
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(n._img, n.x - s / 2, n.y - s / 2, s, s);
      ctx.restore();
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = n.color;
      ctx.stroke();
    } else if (src) {
      drawSourceShape(n, n.r + 8);
      ctx.fill();
      ctx.fillStyle = "#F6F0E6";
      drawSourceShape(n, n.r);
      if (n.shape === "ring") {
        ctx.fill();
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r - 4.2, 0, Math.PI * 2);
        ctx.fillStyle = "#F6F0E6";
        ctx.fill();
      } else {
        ctx.fill();
      }
      ctx.lineWidth = 1.45;
      ctx.strokeStyle = n.color;
      drawSourceShape(n, n.r);
      ctx.stroke();
    } else if (n.id === "laoyan") {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 3, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(196,138,58,0.14)";
      ctx.fill();
      ctx.fillStyle = "#C48A3A";
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = "#8A5A22";
      ctx.stroke();
    } else {
      const s = n.r * 2.15;
      if (n._img) {
        ctx.drawImage(n._img, n.x - s / 2, n.y - s / 2, s, s);
      } else {
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fillStyle = n.color;
        ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#2C241C";
    ctx.font = (n.id === "laoyan" || n.id === "elowen" ? "600 13px " : "500 12px ") +
      '"Noto Serif CJK TC","Noto Sans CJK TC",serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText(n.name, n.x, n.y + n.r + 8);
    ctx.fillStyle = "#5A4636";
    ctx.font = '10px "Noto Serif CJK TC","Noto Sans CJK TC","Noto Sans CJK SC",serif';
    ctx.fillText(n.role, n.x, n.y + n.r + 24);
    ctx.restore();
  }

  const _hexRGB = {};
  const _hexA = {};
  function hexA(hex, a) {
    let rgb = _hexRGB[hex];
    if (!rgb) {
      const h = hex.replace("#", "");
      rgb = _hexRGB[hex] = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    const key = hex + "|" + (a * 1000 | 0);
    let s = _hexA[key];
    if (!s) s = _hexA[key] = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
    return s;
  }

  function hit(mx, my) {
    for (const n of NODES) {
      if (Math.hypot(mx - n.x, my - n.y) <= n.r + 10) return { type: "node", n };
    }
    let best = null, bd = 10;
    for (const e of EDGES) {
      const d = distToQuad(e, mx, my);
      if (d < bd) { bd = d; best = e; }
    }
    if (best) return { type: "edge", e: best };
    return null;
  }

  canvas.addEventListener("mousemove", ev => {
    const r = canvas.getBoundingClientRect();
    hover = hit(ev.clientX - r.left, ev.clientY - r.top);
    if (!hover) {
      tip.innerHTML = "節點或邊 — 只顯示語意標籤";
    } else if (hover.type === "node") {
      const outs = EDGES.filter(e => e.from === hover.n.id).map(e => e.label);
      tip.innerHTML = `<span class="v">${hover.n.name}</span> · ${hover.n.role}<br>${outs.slice(0, 4).join(" · ") || "—"}`;
    } else {
      const a = byId[hover.e.from], b = byId[hover.e.to];
      const extra = hover.e.note ? ` · ${hover.e.note}` : "";
      tip.innerHTML = `<span class="v">${a.name} → ${b.name}</span><br>${hover.e.label}${extra}`;
    }
  });
  canvas.addEventListener("mouseleave", () => {
    hover = null;
    tip.innerHTML = "節點或邊 — 只顯示語意標籤";
  });

  let lastNow = performance.now();
  function frame(now) {
    let dt = now - lastNow;
    lastNow = now;
    if (dt > 33) dt = 33;
    drawSpace();
    drawClusters();
    EDGES.forEach(e => drawEdge(e, edgeFocus(e)));
    drawLiveParticles(dt, now);
    NODES.forEach(n => drawNode(n, nodeFocus(n)));
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
